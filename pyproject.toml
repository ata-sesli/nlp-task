[project]
name = "loancli"
version = "0.1.0"
description = "Classify, extract, and reconcile the provided loan package"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.26.0",
    "jsonschema>=4.23,<5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
loancli = "loancli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["loancli"]
