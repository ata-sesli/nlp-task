[project]
name = "loancli"
version = "0.1.0"
description = "Classify, extract, and reconcile the provided loan package"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
loancli = "loancli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["loancli"]
